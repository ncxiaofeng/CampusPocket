name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 发布用的 APK 放在临时分支 release-assets 上，避免把 20MB 二进制提交进 main。
      # 发版流程：把 CampusPocket-<version>.apk 推到 release-assets，再打 tag。
      - name: Checkout release assets
        uses: actions/checkout@v4
        with:
          ref: release-assets
          path: release-assets

      - name: Resolve release asset
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="release-assets/CampusPocket-${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"
          test -f "$APK"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          NOTES="docs/RELEASE_NOTES_${VERSION}.md"
          if [ -f "$NOTES" ]; then
            gh release create "${GITHUB_REF_NAME}" "${{ steps.vars.outputs.apk }}" \
              --title "冻小梨 ${VERSION}" \
              --notes-file "$NOTES"
          else
            gh release create "${GITHUB_REF_NAME}" "${{ steps.vars.outputs.apk }}" \
              --title "冻小梨 ${VERSION}" \
              --generate-notes
          fi

      # 只保留当前版本的 APK 附件；旧版本的 Release 说明保留，APK 删除。
      - name: Prune old APK assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="${GITHUB_REF_NAME}"
          gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.tag_name != "'"$CURRENT"'") | .id' |
          while read -r rid; do
            [ -z "$rid" ] && continue
            gh api "repos/${{ github.repository }}/releases/$rid/assets" \
              --jq '.[] | select(.name | endswith(".apk")) | .id' |
            while read -r aid; do
              [ -z "$aid" ] && continue
              echo "Deleting old APK asset $aid from release $rid"
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$aid" || true
            done
          done
